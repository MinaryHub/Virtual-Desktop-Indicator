name: Build MSIX (Store)

# Builds the Microsoft Store MSIX package.
#
# Called by the release workflow on every v* tag (after the release exists, so the .msix can be
# attached to it), and runnable on its own from the Actions tab for a Store-only rebuild. Either
# way the .msix is also uploaded as a workflow artifact.
#
# The Store re-signs the package on ingestion, so no certificate is needed here. (The three
# Partner Center identity placeholders in packaging/msix/Package.appxmanifest must be filled in
# before the package matches your reserved Store identity.)
on:
  workflow_call:
    inputs:
      version:
        description: 'Package version (x.y.z — revision .0 is appended automatically)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (x.y.z — revision .0 is appended automatically)'
        required: true
        default: '1.3.7'

permissions:
  contents: write   # attaching the .msix to the release on tag builds

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # `inputs` covers both triggers: the release workflow passes the tag version, a manual
          # run passes whatever was typed in.
          $v = "${{ inputs.version }}"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be x.y.z, got '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $v"

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          # Plain folder layout (NOT single-file): the MSIX is already the container, and an
          # unbundled layout starts faster and gives Store certification real files to inspect.
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:SkipVersionStamp=true `
            -p:Version=$ver `
            -p:AssemblyVersion=$ver `
            -p:FileVersion=$ver `
            -p:InformationalVersion=$ver `
            -o publish-msix
          Remove-Item publish-msix\*.pdb -ErrorAction SilentlyContinue

      - name: Stage package layout
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $stage = "msix-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # App payload
          Copy-Item publish-msix\* $stage -Recurse -Force
          # Assets + manifest (MakeAppx expects the manifest named AppxManifest.xml at the root)
          Copy-Item packaging\msix\Assets $stage\Assets -Recurse -Force
          Copy-Item packaging\msix\Package.appxmanifest $stage\AppxManifest.xml -Force
          # Stamp the 4-part version (revision must be 0 for the Store)
          $manifest = "$stage\AppxManifest.xml"
          # Anchored to <Identity> on purpose: a bare Version="[0-9.]+" also matches the tail of
          # MinVersion="10.0.19041.0" in TargetDeviceFamily and would rewrite the minimum OS
          # version to the app version. -creplace is case-SENSITIVE, so the lowercase
          # version="1.0" in the <?xml?> declaration is left alone. Write UTF-8 without a BOM.
          $stamped = (Get-Content $manifest -Raw) -creplace '(<Identity[^>]*?Version=")[0-9.]+(")', "`${1}$ver.0`$2"
          [System.IO.File]::WriteAllText($manifest, $stamped, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Staged version $ver.0"
          if (Select-String -Path $manifest -Pattern 'PLACEHOLDER' -Quiet) {
            Write-Warning "AppxManifest still contains PLACEHOLDER identity values — the package will NOT match your Partner Center identity. Fill them in before submitting to the Store."
          }

      - name: Locate MakeAppx
        id: sdk
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK" }
          "path=$($makeappx.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using $($makeappx.FullName)"

      - name: Pack MSIX
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "DeskCue-$ver.msix"
          & "${{ steps.sdk.outputs.path }}" pack /d msix-stage /p $out /o
          Write-Host "Built $out"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskCue-msix-${{ steps.ver.outputs.version }}
          path: DeskCue-*.msix
          if-no-files-found: error

      # Tag builds only: the release workflow calls this after creating the release, so the
      # asset lands next to the installer and the Linux tarball.
      - name: Attach the MSIX to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "DeskCue-${{ steps.ver.outputs.version }}.msix" --clobber
