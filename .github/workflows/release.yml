name: Release

# Push a tag like v1.1.0 to build the installer and publish a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # allow gh release create to write releases/assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $v"

      - name: Publish (self-contained single file)
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:SkipVersionStamp=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.version }} `
            -p:FileVersion=${{ steps.ver.outputs.version }} `
            -p:InformationalVersion=${{ steps.ver.outputs.version }} `
            -o publish-sc
          Remove-Item publish-sc\*.pdb -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "installer\VirtualDesktopIndicator-Setup-${{ steps.ver.outputs.version }}.exe" `
            --title "${{ github.ref_name }}" `
            --generate-notes
