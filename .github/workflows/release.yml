name: Release

# Push a tag like v1.1.0 to build the installers and publish a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # allow gh release create/upload to write releases/assets

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $v"

      - name: Publish (self-contained single file)
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:SkipVersionStamp=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.version }} `
            -p:FileVersion=${{ steps.ver.outputs.version }} `
            -p:InformationalVersion=${{ steps.ver.outputs.version }} `
            -o publish-sc
          Remove-Item publish-sc\*.pdb -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - name: Create GitHub Release (with Windows installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "installer\DeskCue-Setup-${{ steps.ver.outputs.version }}.exe" `
            --title "${{ github.ref_name }}" `
            --generate-notes

  linux:
    runs-on: ubuntu-latest
    needs: windows   # the release is created by the windows job; we upload to it
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

      - name: Publish (self-contained single file, linux-x64)
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          dotnet publish linux/DeskCue.Linux.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:SkipVersionStamp=true \
            -p:Version="$VER" \
            -p:AssemblyVersion="$VER" \
            -p:FileVersion="$VER" \
            -p:InformationalVersion="$VER" \
            -o publish-linux
          rm -f publish-linux/*.pdb

      - name: Assemble tarball
        id: pack
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          STAGE="deskcue-$VER"
          TARBALL="DeskCue-linux-x64-$VER.tar.gz"
          mkdir -p "$STAGE"
          cp publish-linux/deskcue "$STAGE/"
          cp linux/packaging/install.sh linux/packaging/uninstall.sh "$STAGE/"
          cp linux/packaging/README.linux.md "$STAGE/README.md"
          chmod +x "$STAGE/deskcue" "$STAGE"/*.sh
          tar czf "$TARBALL" "$STAGE"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload Linux tarball to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.pack.outputs.tarball }}" --clobber

  # Store package. Runs after `windows` so the release already exists when the reusable
  # workflow attaches the .msix to it.
  msix:
    needs: windows
    permissions:
      contents: write
    uses: ./.github/workflows/msix.yml
    with:
      version: ${{ needs.windows.outputs.version }}
